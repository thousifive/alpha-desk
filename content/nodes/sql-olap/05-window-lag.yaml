slug: window-lag
title: LAG & Daily Returns
description: Window functions over time. PARTITION BY, ORDER BY, LAG, and the filter-before-window trap.
order: 5
prerequisites: [ctes]
xp_reward: 70
exercises:
  - slug: sql-lag-daily-return
    type: sql
    persona: marcus
    title: AURX daily returns, Q1 2025
    difficulty: 2
    prompt: |
      Daily returns for **AURX during Q1 2025** (Jan 1 to Mar 31). `prev_close` is the
      previous trading day's close, **even if that day falls in December 2024**, so the
      first row must not be NULL. `ret = close / prev_close - 1`, rounded to 6 decimals.
      Order by date.

      Columns: `date`, `close`, `prev_close`, `ret`.

      *Marcus: careful where you put the WHERE.*
    solution_sql: |
      WITH r AS (
        SELECT date, close,
               LAG(close) OVER (ORDER BY date) AS prev_close
        FROM prices
        WHERE ticker = 'AURX'
      )
      SELECT date, close, prev_close, ROUND(close / prev_close - 1, 6) AS ret
      FROM r
      WHERE date BETWEEN DATE '2025-01-01' AND DATE '2025-03-31'
      ORDER BY date
    order_sensitive: true
    float_tol: 0.000001

  - slug: sql-biggest-moves-2025
    type: sql
    persona: priya
    title: Biggest movers of 2025
    difficulty: 2
    prompt: |
      What were the **10 biggest single-day moves (up or down) across all names in 2025**?
      A move is close-to-previous-close return, rounded to 6 decimals. The previous close
      can come from 2024. Largest absolute move first.

      Columns: `date`, `ticker`, `ret`.
    solution_sql: |
      WITH r AS (
        SELECT date, ticker,
               close / LAG(close) OVER (PARTITION BY ticker ORDER BY date) - 1 AS ret
        FROM prices
      )
      SELECT date, ticker, ROUND(ret, 6) AS ret
      FROM r
      WHERE date >= DATE '2025-01-01' AND date < DATE '2026-01-01'
      ORDER BY ABS(ret) DESC
      LIMIT 10
    order_sensitive: true
    float_tol: 0.000001

  - slug: sql-split-detector
    type: sql
    persona: lena
    title: Is that a crash or a split?
    difficulty: 2
    prompt: |
      Our returns pipeline flagged a -50% day. Before anyone panics: find every day where a
      stock's **close fell more than 40% versus the previous close**. Those are almost
      always unadjusted splits. Cross-check against `corporate_actions` afterwards.

      Columns: `ticker`, `date`, `prev_close`, `close`.
    solution_sql: |
      WITH r AS (
        SELECT ticker, date, close,
               LAG(close) OVER (PARTITION BY ticker ORDER BY date) AS prev_close
        FROM prices
      )
      SELECT ticker, date, prev_close, close
      FROM r
      WHERE close / prev_close - 1 < -0.4
