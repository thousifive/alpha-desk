slug: fastapi-background
title: Background Tasks
description: BackgroundTasks vs a real queue.
order: 6
prerequisites:
- fastapi-dependencies
xp_reward: 50
exercises:
  - slug: fastapi-background-report
    type: python
    persona: priya
    packages: [fastapi, httpx]
    title: Don't make me wait for the email
    difficulty: 2
    prompt: |
      `POST /reports` builds a PnL report and **emails it before responding**, so Priya
      stares at a spinner for the whole SMTP round trip.

      Change `create_report` to schedule `email_report(report_id, to)` with FastAPI's
      **`BackgroundTasks`** and return `{"report_id": ..., "status": "queued"}` with status
      **202**.

      The hidden tests call the endpoint function directly with their own
      `BackgroundTasks` and check that the email isn't sent before the response, but is
      sent afterwards in a real request.

      *Priya: tell me it's coming. I don't need to watch it happen.*
    starter_code: |
      from fastapi import BackgroundTasks, FastAPI
      from pydantic import BaseModel

      app = FastAPI()
      OUTBOX: list[tuple[int, str]] = []


      class ReportRequest(BaseModel):
          to: str


      def email_report(report_id: int, to: str) -> None:
          OUTBOX.append((report_id, to))  # pretend this is slow SMTP


      @app.post("/reports")
      async def create_report(req: ReportRequest, tasks: BackgroundTasks):
          report_id = 7
          email_report(report_id, req.to)
          return {"report_id": report_id, "status": "sent"}
    visible_tests: |
      import httpx

      from solution import app


      async def test_endpoint_answers():
          transport = httpx.ASGITransport(app=app)
          async with httpx.AsyncClient(transport=transport, base_url="http://t") as c:
              r = await c.post("/reports", json={"to": "priya@meridian.example"})
          assert r.json()["report_id"] == 7
    hidden_tests: |
      import httpx
      from fastapi import BackgroundTasks

      from solution import OUTBOX, ReportRequest, app, create_report, email_report


      async def test_scheduled_not_sent_inline():
          OUTBOX.clear()
          tasks = BackgroundTasks()
          body = await create_report(ReportRequest(to="pm@meridian.example"), tasks)
          assert body == {"report_id": 7, "status": "queued"}
          assert OUTBOX == []  # nothing sent before the response
          assert [t.func for t in tasks.tasks] == [email_report]


      async def test_sent_after_response_with_202():
          OUTBOX.clear()
          transport = httpx.ASGITransport(app=app)
          async with httpx.AsyncClient(transport=transport, base_url="http://t") as c:
              r = await c.post("/reports", json={"to": "pm@meridian.example"})
          assert r.status_code == 202
          assert OUTBOX == [(7, "pm@meridian.example")]
    solution: |
      from fastapi import BackgroundTasks, FastAPI
      from pydantic import BaseModel

      app = FastAPI()
      OUTBOX: list[tuple[int, str]] = []


      class ReportRequest(BaseModel):
          to: str


      def email_report(report_id: int, to: str) -> None:
          OUTBOX.append((report_id, to))


      @app.post("/reports", status_code=202)
      async def create_report(req: ReportRequest, tasks: BackgroundTasks):
          report_id = 7
          # Runs after the response is sent, in the same process. Fine for small jobs.
          tasks.add_task(email_report, report_id, req.to)
          return {"report_id": report_id, "status": "queued"}

  - slug: quiz-background-or-queue
    type: quiz
    persona: lena
    title: BackgroundTasks or a real queue?
    difficulty: 2
    prompt: |
      The nightly **risk recalculation** takes 20 minutes, must retry on failure, and must
      not be lost if we redeploy the API mid-run. Where should it run?
    choices:
      - "`BackgroundTasks` in the request that triggers it."
      - "`asyncio.create_task()` so it doesn't block the event loop."
      - A job queue with workers (Arq, Celery, RQ, or a cloud queue), triggered by the API or a scheduler.
      - A `while True` loop in the FastAPI lifespan handler.
    answer: 2
    explanation: |
      `BackgroundTasks` and bare tasks live **inside the API process**: a deploy or crash
      loses them, and there's no retry or visibility. Long, must-not-lose work belongs in a
      durable queue whose workers can retry, scale separately, and survive API restarts.
      BackgroundTasks is for small fire-and-forget extras like an audit log write or a
      notification.
