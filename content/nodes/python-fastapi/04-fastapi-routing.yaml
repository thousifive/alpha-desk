slug: fastapi-routing
title: FastAPI Routing
description: Path/query/body params and response models.
order: 4
prerequisites:
- py-async
xp_reward: 50
exercises:
  - slug: fastapi-price-history
    type: python
    persona: priya
    packages: [fastapi, httpx]
    title: Last N closes, please
    difficulty: 1
    prompt: |
      Priya's dashboard needs `GET /prices/{ticker}?limit=N`, which returns the **last N
      closes** for a ticker from the in-memory `PRICES` dict (oldest first, as stored):

      ```json
      {"ticker": "AURX", "closes": [10.4, 10.9]}
      ```

      - `limit` defaults to 5 and must be between 1 and 30 (FastAPI should answer **422**
        otherwise, without you writing an `if`).
      - Unknown ticker → **404**.
      - Lowercase tickers work too: `/prices/aurx` is AURX.

      *Priya: last five is what I look at. Thirty if I'm feeling brave.*
    starter_code: |
      from fastapi import FastAPI

      app = FastAPI()

      PRICES: dict[str, list[float]] = {
          "AURX": [10.0, 10.2, 10.1, 10.4, 10.9, 11.3, 11.0],
          "BLNK": [52.0, 51.5],
      }


      @app.get("/prices/{ticker}")
      async def price_history(ticker: str, limit: int = 5):
          return {"ticker": ticker, "closes": PRICES[ticker][:limit]}
    visible_tests: |
      import httpx

      from solution import app


      async def test_default_limit():
          transport = httpx.ASGITransport(app=app)
          async with httpx.AsyncClient(transport=transport, base_url="http://t") as c:
              r = await c.get("/prices/AURX")
          assert r.status_code == 200
          assert len(r.json()["closes"]) == 5
    hidden_tests: |
      import httpx

      from solution import app


      def client():
          return httpx.AsyncClient(transport=httpx.ASGITransport(app=app), base_url="http://t")


      async def test_returns_the_last_n_oldest_first():
          async with client() as c:
              r = await c.get("/prices/AURX", params={"limit": 2})
          assert r.json() == {"ticker": "AURX", "closes": [11.3, 11.0]}


      async def test_lowercase_ticker():
          async with client() as c:
              r = await c.get("/prices/blnk")
          assert r.json() == {"ticker": "BLNK", "closes": [52.0, 51.5]}


      async def test_limit_bounds_are_422():
          async with client() as c:
              assert (await c.get("/prices/AURX", params={"limit": 0})).status_code == 422
              assert (await c.get("/prices/AURX", params={"limit": 31})).status_code == 422


      async def test_unknown_ticker_is_404():
          async with client() as c:
              assert (await c.get("/prices/ZZZZ")).status_code == 404
    solution: |
      from typing import Annotated

      from fastapi import FastAPI, HTTPException, Query

      app = FastAPI()

      PRICES: dict[str, list[float]] = {
          "AURX": [10.0, 10.2, 10.1, 10.4, 10.9, 11.3, 11.0],
          "BLNK": [52.0, 51.5],
      }


      @app.get("/prices/{ticker}")
      async def price_history(ticker: str, limit: Annotated[int, Query(ge=1, le=30)] = 5):
          # Query(ge=, le=) puts the bounds in the OpenAPI schema and returns 422 for free.
          key = ticker.upper()
          if key not in PRICES:
              raise HTTPException(status_code=404, detail=f"Unknown ticker {key}")
          return {"ticker": key, "closes": PRICES[key][-limit:]}

  - slug: fastapi-response-model
    type: python
    persona: lena
    packages: [fastapi, httpx]
    title: Don't leak the internal note
    difficulty: 2
    prompt: |
      `POST /orders` echoes the stored order back, **including `internal_note`**, which
      risk writes things into that clients must never see.

      - Validate the body as `OrderIn` (`ticker: str`, `qty: int`).
      - Respond with **201** and an `OrderOut` (`id`, `ticker`, `qty`, `status`) only. Use
        FastAPI's response model so extra fields are dropped even if the handler returns
        them.

      *Lena: the response model is your contract. Don't trust every handler to filter.*
    starter_code: |
      from fastapi import FastAPI

      app = FastAPI()
      _next_id = 1


      @app.post("/orders")
      async def create_order(body: dict):
          global _next_id
          row = {**body, "id": _next_id, "status": "new", "internal_note": "client on watchlist"}
          _next_id += 1
          return row
    visible_tests: |
      import httpx

      from solution import app


      async def test_creates_order():
          transport = httpx.ASGITransport(app=app)
          async with httpx.AsyncClient(transport=transport, base_url="http://t") as c:
              r = await c.post("/orders", json={"ticker": "AURX", "qty": 10})
          assert r.json()["ticker"] == "AURX"
    hidden_tests: |
      import httpx

      from solution import app


      def client():
          return httpx.AsyncClient(transport=httpx.ASGITransport(app=app), base_url="http://t")


      async def test_201_and_exact_fields():
          async with client() as c:
              r = await c.post("/orders", json={"ticker": "CVTA", "qty": -5})
          assert r.status_code == 201
          assert set(r.json()) == {"id", "ticker", "qty", "status"}


      async def test_bad_body_is_422():
          async with client() as c:
              r = await c.post("/orders", json={"ticker": "CVTA", "qty": "lots"})
          assert r.status_code == 422


      async def test_openapi_documents_the_contract():
          schema = app.openapi()["paths"]["/orders"]["post"]
          assert "201" in schema["responses"]
    solution: |
      from fastapi import FastAPI
      from pydantic import BaseModel

      app = FastAPI()
      _next_id = 1


      class OrderIn(BaseModel):
          ticker: str
          qty: int


      class OrderOut(BaseModel):
          id: int
          ticker: str
          qty: int
          status: str


      # response_model filters the return value through OrderOut: unknown keys are dropped.
      @app.post("/orders", response_model=OrderOut, status_code=201)
      async def create_order(body: OrderIn):
          global _next_id
          row = {**body.model_dump(), "id": _next_id, "status": "new", "internal_note": "watch"}
          _next_id += 1
          return row

  - slug: quiz-path-query-body
    type: quiz
    persona: lena
    title: Where does each parameter come from?
    difficulty: 1
    prompt: |
      ```python
      @app.post("/books/{book_id}/orders")
      async def place(book_id: int, dry_run: bool = False, order: OrderIn = ...): ...
      ```

      How does FastAPI read `book_id`, `dry_run` and `order`?
    choices:
      - All three from the JSON body.
      - "`book_id` from the path, `dry_run` from the query string, `order` from the JSON body."
      - "`book_id` and `dry_run` from the path, `order` from the query string."
      - It's ambiguous; FastAPI needs Path(), Query() and Body() on every parameter.
    answer: 1
    explanation: |
      A name that appears in the path template is a path parameter. Other simple types
      (int, bool, str…) default to query parameters, and Pydantic models default to the
      request body. You add `Query()`/`Path()`/`Body()` only for extra rules or metadata.
