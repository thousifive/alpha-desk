slug: py-async
title: Async / Await
description: The event loop, coroutines, gather, and blocking-call traps.
order: 3
prerequisites:
- py-dataclasses-pydantic
xp_reward: 50
exercises:
  - slug: py-async-blocking-call
    type: python
    persona: lena
    title: Why is the API stalling?
    difficulty: 2
    prompt: |
      Our price service freezes under load. `fetch_quote` is `async`, but someone put a
      **blocking call** inside it, so five concurrent requests take five times as long.

      Fix `fetch_quote` so that `fetch_many` of 5 tickers finishes in about one delay, not
      five. Keep the signatures.

      *Lena: async isn't magic. One blocking call stalls the whole event loop.*
    starter_code: |
      import asyncio
      import time

      DELAY_S = 0.2


      async def fetch_quote(ticker: str) -> dict[str, object]:
          time.sleep(DELAY_S)  # pretend this is the network
          return {"ticker": ticker, "px": 100.0}


      async def fetch_many(tickers: list[str]) -> list[dict[str, object]]:
          return [await fetch_quote(t) for t in tickers]
    visible_tests: |
      from solution import fetch_quote


      async def test_returns_a_quote():
          q = await fetch_quote("AURX")
          assert q["ticker"] == "AURX"
    hidden_tests: |
      import time

      from solution import DELAY_S, fetch_many


      async def test_results_in_input_order():
          got = await fetch_many(["AURX", "BLNK", "CVTA"])
          assert [q["ticker"] for q in got] == ["AURX", "BLNK", "CVTA"]


      async def test_runs_concurrently():
          start = time.perf_counter()
          await fetch_many(["A", "B", "C", "D", "E"])
          elapsed = time.perf_counter() - start
          assert elapsed < DELAY_S * 2.5, f"took {elapsed:.2f}s; still sequential or blocking"
    solution: |
      import asyncio

      DELAY_S = 0.2


      async def fetch_quote(ticker: str) -> dict[str, object]:
          await asyncio.sleep(DELAY_S)  # yields to the event loop instead of blocking it
          return {"ticker": ticker, "px": 100.0}


      async def fetch_many(tickers: list[str]) -> list[dict[str, object]]:
          # gather schedules all coroutines at once and returns results in input order.
          return list(await asyncio.gather(*(fetch_quote(t) for t in tickers)))

  - slug: py-async-timeouts
    type: python
    persona: marcus
    title: One slow vendor shouldn't stall the screen
    difficulty: 2
    prompt: |
      `fetch_all(tickers, fetch, timeout_s)` pulls prices from a vendor. Right now it's
      sequential, and one hung ticker blocks everything.

      Make it **concurrent**, and give each ticker its own timeout: a ticker that doesn't
      answer within `timeout_s` maps to `None`. The others still return their price.
      Return a dict `ticker → price | None`.

      `fetch` is an `async def fetch(ticker) -> float` passed in by the caller.

      *Marcus: I'd rather see a blank cell for QBTX than a frozen screen.*
    starter_code: |
      from collections.abc import Awaitable, Callable


      async def fetch_all(
          tickers: list[str],
          fetch: Callable[[str], Awaitable[float]],
          timeout_s: float,
      ) -> dict[str, float | None]:
          out: dict[str, float | None] = {}
          for t in tickers:
              out[t] = await fetch(t)
          return out
    visible_tests: |
      from solution import fetch_all


      async def instant(ticker):
          return 1.0


      async def test_all_fast():
          assert await fetch_all(["AURX", "BLNK"], instant, 1.0) == {"AURX": 1.0, "BLNK": 1.0}
    hidden_tests: |
      import asyncio
      import time

      from solution import fetch_all

      DELAYS = {"AURX": 0.05, "BLNK": 0.1, "QBTX": 1.0}


      async def vendor(ticker):
          await asyncio.sleep(DELAYS[ticker])
          return {"AURX": 10.0, "BLNK": 20.0, "QBTX": 30.0}[ticker]


      async def test_slow_ticker_becomes_none():
          got = await fetch_all(["AURX", "BLNK", "QBTX"], vendor, 0.3)
          assert got == {"AURX": 10.0, "BLNK": 20.0, "QBTX": None}


      async def test_runs_concurrently():
          start = time.perf_counter()
          await fetch_all(["AURX", "BLNK", "QBTX"], vendor, 0.3)
          elapsed = time.perf_counter() - start
          assert elapsed < 0.6, f"took {elapsed:.2f}s"


      async def test_keeps_input_order():
          got = await fetch_all(["BLNK", "AURX"], vendor, 1.0)
          assert list(got) == ["BLNK", "AURX"]
    solution: |
      import asyncio
      from collections.abc import Awaitable, Callable


      async def fetch_all(
          tickers: list[str],
          fetch: Callable[[str], Awaitable[float]],
          timeout_s: float,
      ) -> dict[str, float | None]:
          async def one(t: str) -> float | None:
              try:
                  # wait_for cancels the inner coroutine when time runs out.
                  return await asyncio.wait_for(fetch(t), timeout_s)
              except TimeoutError:  # asyncio.TimeoutError is an alias since 3.11
                  return None

          prices = await asyncio.gather(*(one(t) for t in tickers))
          return dict(zip(tickers, prices, strict=True))

  - slug: quiz-async-blocking
    type: quiz
    persona: lena
    title: Which line stalls the event loop?
    difficulty: 1
    prompt: |
      Inside an `async def` FastAPI endpoint, which of these **blocks every other request**
      while it runs?
    choices:
      - "`await asyncio.sleep(1)`"
      - "`requests.get(vendor_url)`"
      - "`await httpx_async_client.get(vendor_url)`"
      - "`await asyncio.to_thread(parse_big_file, path)`"
    answer: 1
    explanation: |
      `requests` is synchronous: the thread waits on the socket and the event loop can't run
      anything else meanwhile. The `await`ed calls yield control while they wait, and
      `asyncio.to_thread` moves blocking work onto a worker thread. In FastAPI, a plain `def`
      endpoint (not `async def`) is also safe, because FastAPI runs it in a threadpool.
