# The six skill-tree branches. Each branch ends in one or more bosses, fought in list order
# (Agents & LLMs has two). Boss fights themselves arrive in M5.
branches:
  - id: sql-olap
    title: SQL & OLAP
    description: Window functions, CTEs, time-series aggregation, and columnar engines.
    order: 1
    playable_from: M1
    bosses:
      - title: The Analytics Desk
        description: DuckDB queries for returns, rolling drawdown, and sector exposure over the fund's book.
  - id: python-fastapi
    title: Python & FastAPI
    description: Typed, async, tested Python services.
    order: 2
    playable_from: M2
    bosses:
      - title: The API Gateway
        description: Typed, tested FastAPI endpoints that serve the Analytics Desk numbers to the PMs.
  - id: data-pipelines
    title: Data Pipelines
    description: Polars, ETL, validation, and idempotent incremental loads.
    order: 3
    playable_from: M2
    bosses:
      - title: The Data Feed
        description: An ETL that loads daily prices into DuckDB with Polars, idempotently.
  - id: agents-llms
    title: Agents & LLMs
    description: Tool use, MCP, LangGraph, RAG, text-to-SQL guardrails, and evals.
    order: 4
    playable_from: M4
    bosses:
      - title: The Oracle
        description: An MCP server exposing the market DB and SEC filings as tools.
      - title: The Copilot
        description: A LangGraph agent doing text-to-SQL plus RAG over 10-K filings.
  - id: cloud-devops
    title: Cloud & DevOps
    description: Docker, CI, managed services, and observability.
    order: 5
    playable_from: M6
    bosses:
      - title: Go Live
        description: Deploy the Research Copilot with Docker and CI.
  - id: buy-side-finance
    title: Buy-Side Finance
    description: Exposures, factors, risk-adjusted returns, and how a fund thinks.
    order: 6
    playable_from: M3
    bosses:
      - title: The PM Review
        description: Walk Priya through the book's exposures, Sharpe, drawdown, and PnL attribution.
